[project]
name = "franchise-fruns"
version = "0.1.0"
description = "Match franchise names to FRUNS identifiers"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "rapidfuzz>=3.0",
]

[tool.setuptools]
py-modules = ["match_to_fruns", "normalize_franchise_names"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
